server.port=${SERVER_PORT:8080}
spring.application.name=qagent
# 默认激活 local profile（本机开发，pgvector 配置在 application-local.properties）
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ========== 模型角色分配（关键：避免多个 ChatModel 冲突） ==========
# 对话(chat) 用 DeepSeek，向量化(embedding) 用 OpenAI 兼容(SiliconFlow)
# 若不指定，OpenAI starter 和 DeepSeek starter 都会创建 ChatModel，导致冲突
spring.ai.model.chat=deepseek
spring.ai.model.embedding=openai

# ========== DeepSeek 对话模型（生成回答） ==========
spring.ai.deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY:}
spring.ai.deepseek.chat.model=${DEEPSEEK_CHAT_MODEL:deepseek-chat}
spring.ai.deepseek.chat.temperature=0.3

# ========== Embedding 向量化模型（OpenAI 兼容接口，指向 SiliconFlow） ==========
# DeepSeek 没有 Embedding 接口，所以向量化用硅基流动 SiliconFlow 的 BGE-M3
spring.ai.openai.base-url=${EMBEDDING_BASE_URL:https://api.siliconflow.cn}
spring.ai.openai.api-key=${EMBEDDING_API_KEY:}
spring.ai.openai.embedding.options.model=${EMBEDDING_MODEL:BAAI/bge-m3}

# ========== Rerank 重排模型（SiliconFlow，提升检索精度） ==========
app.rerank.enabled=${RERANK_ENABLED:true}
app.rerank.base-url=${RERANK_BASE_URL:https://api.siliconflow.cn}
app.rerank.api-key=${RERANK_API_KEY:}
app.rerank.model=${RERANK_MODEL:BAAI/bge-reranker-v2-m3}


