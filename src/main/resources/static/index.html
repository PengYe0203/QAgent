<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QAgent · 企业文档智能问答</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --bg: #f1f5f9;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-muted: #64748b;
    --user-bubble: #2563eb;
    --ai-bubble: #ffffff;
    --danger: #dc2626;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }
  .app { display: flex; height: 100vh; }

  /* ===== 侧边栏 ===== */
  .sidebar {
    width: 320px; min-width: 320px;
    background: var(--card);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  .sidebar-header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 16px;
  }
  .sidebar-header h1 { font-size: 16px; font-weight: 600; }
  .sidebar-header p { font-size: 12px; color: var(--text-muted); }

  .sidebar-body { flex: 1; overflow-y: auto; padding: 16px; }
  .section-title {
    font-size: 12px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px;
  }
  .upload-zone {
    border: 2px dashed var(--border); border-radius: var(--radius);
    padding: 18px; text-align: center; color: var(--text-muted);
    font-size: 13px; cursor: pointer; transition: all .2s;
    background: #f8fafc; margin-bottom: 12px;
  }
  .upload-zone:hover, .upload-zone.dragover {
    border-color: var(--primary); background: #eff6ff; color: var(--primary);
  }
  .upload-zone input { display: none; }
  .upload-zone .icon { font-size: 24px; display: block; margin-bottom: 4px; }
  .upload-zone small { display: block; margin-top: 4px; font-size: 11px; }

  .doc-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 8px;
    background: #f8fafc; font-size: 13px;
  }
  .doc-item .doc-icon { font-size: 18px; }
  .doc-item .doc-info { flex: 1; min-width: 0; }
  .doc-item .doc-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .doc-item .doc-meta { font-size: 11px; color: var(--text-muted); }
  .doc-item button {
    border: none; background: none; color: var(--danger);
    cursor: pointer; font-size: 15px; padding: 2px 4px; border-radius: 6px;
  }
  .doc-item button:hover { background: #fef2f2; }
  .doc-list-empty { text-align: center; color: var(--text-muted); font-size: 12px; padding: 20px 0; }

  /* ===== 主区域 ===== */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .main-header {
    padding: 14px 24px; background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .main-header h2 { font-size: 15px; font-weight: 600; }
  .status { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; display: inline-block; }

  .chat-area { flex: 1; overflow-y: auto; padding: 24px; }
  .message { display: flex; margin-bottom: 20px; gap: 12px; }
  .message .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600; color: #fff;
  }
  .message.user { flex-direction: row-reverse; }
  .message.user .avatar { background: var(--primary); }
  .message.ai .avatar { background: linear-gradient(135deg, #7c3aed, #2563eb); }
  .bubble {
    max-width: 78%; padding: 12px 16px; border-radius: var(--radius);
    font-size: 14px; line-height: 1.7; word-break: break-word;
  }
  .message.user .bubble { background: var(--user-bubble); color: #fff; border-top-right-radius: 4px; white-space: pre-wrap; }
  .message.ai .bubble { background: var(--ai-bubble); border: 1px solid var(--border); border-top-left-radius: 4px; }

  /* ===== AI 气泡内 Markdown 排版 ===== */
  .bubble .md { white-space: normal; }
  .bubble .md > :first-child { margin-top: 0; }
  .bubble .md > :last-child { margin-bottom: 0; }
  .bubble .md p { margin: 0 0 8px; }
  .bubble .md h1, .bubble .md h2, .bubble .md h3, .bubble .md h4 {
    margin: 12px 0 6px; line-height: 1.4; font-weight: 600;
  }
  .bubble .md h1 { font-size: 17px; }
  .bubble .md h2 { font-size: 16px; }
  .bubble .md h3 { font-size: 15px; }
  .bubble .md h4 { font-size: 14px; }
  .bubble .md ul, .bubble .md ol { margin: 0 0 8px; padding-left: 22px; }
  .bubble .md li { margin: 2px 0; }
  .bubble .md strong { color: #111827; }
  .bubble .md code {
    background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 4px;
    padding: 1px 5px; font-size: 12.5px; font-family: Consolas, "Courier New", monospace;
  }
  .bubble .md pre {
    background: #0f172a; color: #e2e8f0; border-radius: 8px;
    padding: 10px 12px; margin: 8px 0; overflow-x: auto; white-space: pre;
  }
  .bubble .md pre code { background: transparent; border: none; color: inherit; padding: 0; }
  .bubble .md blockquote {
    border-left: 3px solid #bfdbfe; background: #f8fafc;
    margin: 8px 0; padding: 6px 12px; color: var(--text-muted);
    border-radius: 0 6px 6px 0;
  }
  .bubble .md table { border-collapse: collapse; margin: 8px 0; font-size: 13px; display: block; overflow-x: auto; }
  .bubble .md th, .bubble .md td { border: 1px solid var(--border); padding: 5px 10px; }
  .bubble .md th { background: #f8fafc; font-weight: 600; }
  .bubble .md hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }

  /* ===== 参考来源（文件名 + 位置，点击展开原文）===== */
  .sources { margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 10px; }
  .sources-title {
    font-size: 12px; font-weight: 600; color: var(--text-muted);
    margin-bottom: 6px; display: flex; align-items: center; gap: 4px;
  }
  .source-item { margin-bottom: 6px; }
  .source-head {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    cursor: pointer; user-select: none;
    background: #f8fafc; border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font-size: 12px;
    transition: border-color .15s;
  }
  .source-head:hover { border-color: var(--primary); background: #eff6ff; }
  .source-file { font-weight: 600; color: var(--primary-dark); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }
  .source-loc { color: var(--text-muted); background: #eef2ff; border-radius: 999px; padding: 1px 8px; }
  .source-toggle { margin-left: auto; color: #94a3b8; font-size: 11px; flex-shrink: 0; }
  .source-snippet {
    margin-top: 4px; background: #fffef5; border: 1px solid #fde68a;
    border-radius: 8px; padding: 8px 12px; font-size: 12.5px;
    line-height: 1.7; color: #713f12; white-space: pre-wrap; word-break: break-word;
  }

  .welcome { text-align: center; padding-top: 15vh; color: var(--text-muted); }
  .welcome .big { font-size: 44px; margin-bottom: 16px; }
  .welcome h3 { font-size: 18px; color: var(--text); margin-bottom: 8px; }
  .welcome p { font-size: 13px; }

  /* ===== 输入区 ===== */
  .input-bar { padding: 16px 24px 20px; background: var(--card); border-top: 1px solid var(--border); }
  .input-box {
    display: flex; align-items: flex-end; gap: 10px;
    background: #fff; border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 12px;
  }
  .input-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  .input-box textarea {
    flex: 1; border: none; outline: none; resize: none;
    font-size: 14px; font-family: inherit; line-height: 1.6; max-height: 120px;
    color: var(--text); background: transparent;
  }
  .send-btn {
    border: none; background: var(--primary); color: #fff;
    width: 40px; height: 40px; border-radius: 10px; cursor: pointer;
    font-size: 18px; flex-shrink: 0; transition: background .2s;
  }
  .send-btn:hover { background: var(--primary-dark); }
  .send-btn:disabled { background: #93c5fd; cursor: not-allowed; }
  .hint { text-align: center; font-size: 11px; color: #94a3b8; margin-top: 8px; }

  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #1e293b; color: #fff; padding: 10px 20px; border-radius: 8px;
    font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 100;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <!-- 侧边栏：文档管理 -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">Q</div>
      <div>
        <h1>企业文档问答</h1>
        <p>基于 RAG 的智能问答</p>
      </div>
    </div>
    <div class="sidebar-body">
      <div class="section-title">知识库文档</div>
      <div class="upload-zone" id="uploadZone">
        <span class="icon">📄</span>
        点击或拖拽上传文档
        <small>支持 PDF / Word / Excel</small>
        <input type="file" id="fileInput" multiple accept=".pdf,.docx,.xlsx,.xls">
      </div>
      <div id="docList">
        <div class="doc-list-empty">尚未上传文档，快去上传吧～</div>
      </div>
    </div>
  </aside>

  <!-- 主区域：聊天 -->
  <main class="main">
    <div class="main-header">
      <h2>💬 智能问答</h2>
      <span class="status"><span class="dot"></span>服务运行中</span>
    </div>
    <div class="chat-area" id="chatArea">
      <div class="welcome">
        <div class="big">🤖</div>
        <h3>企业文档智能助手</h3>
        <p>上传公司文档后，即可向 AI 提问<br>例如：「员工报销流程是怎样的？」</p>
      </div>
    </div>
    <div class="input-bar">
      <div class="input-box">
        <textarea id="input" rows="1" placeholder="输入你的问题，Enter 发送，Shift+Enter 换行…"></textarea>
        <button class="send-btn" id="sendBtn" title="发送">➤</button>
      </div>
      <div class="hint">回答基于知识库文档生成，请以公司正式制度为准 · 点击"参考来源"可查看原文位置</div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<!-- Markdown 渲染 + HTML 消毒（本地自带，不依赖外网 CDN；异常时自动降级为纯文本显示） -->
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>

<script>
const state = { busy: false, conversationId: null };
const $ = id => document.getElementById(id);
const chatArea = $('chatArea');
const input = $('input');
const sendBtn = $('sendBtn');

const MD_OK = typeof window.marked !== 'undefined' && typeof window.DOMPurify !== 'undefined';

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function scrollBottom() { chatArea.scrollTop = chatArea.scrollHeight; }

/* ============ 聊天 ============ */
function addMessage(role) {
  const el = document.createElement('div');
  el.className = 'message ' + role;
  el.innerHTML = `<div class="avatar">${role === 'user' ? '我' : 'AI'}</div><div class="bubble"></div>`;
  chatArea.appendChild(el);
  const w = chatArea.querySelector('.welcome');
  if (w) w.remove();
  scrollBottom();
  return el.querySelector('.bubble');
}

/**
 * 把 Markdown 渲染成安全的 HTML。
 * marked 负责转换，DOMPurify 负责消毒（防 XSS）；CDN 不可用时降级为转义纯文本。
 */
function renderMarkdown(text) {
  if (!text) return '';
  if (MD_OK) {
    try {
      return window.DOMPurify.sanitize(window.marked.parse(text));
    } catch (e) { /* 落到纯文本降级 */ }
  }
  return esc(text).replace(/\n/g, '<br>');
}

/**
 * 渲染"参考来源"列表：每行 文件名 + 位置，点击展开/收起命中原文片段。
 * snippet 用 textContent 写入，天然免疫 XSS。
 */
function renderSources(box, sources) {
  if (!sources || !sources.length) { box.remove(); return; }
  box.innerHTML = '<div class="sources-title">📎 参考来源（点击查看原文）</div>' +
    sources.map((s, i) => `
      <div class="source-item">
        <div class="source-head" role="button" aria-expanded="false">
          <span class="source-file" title="${esc(s.source)}">${esc(s.source)}</span>
          ${s.sourceRef ? `<span class="source-loc">${esc(s.sourceRef)}</span>` : ''}
          <span class="source-toggle">展开原文 ▾</span>
        </div>
        <div class="source-snippet" hidden></div>
      </div>`).join('');

  box.querySelectorAll('.source-item').forEach((itemEl, i) => {
    const src = sources[i];
    const headEl = itemEl.querySelector('.source-head');
    const snippetEl = itemEl.querySelector('.source-snippet');
    const toggleEl = itemEl.querySelector('.source-toggle');
    headEl.addEventListener('click', () => {
      const show = snippetEl.hidden;
      if (show) {
        snippetEl.textContent = (src.snippet || '').trim() || '（该片段无原文内容）';
        toggleEl.textContent = '收起原文 ▴';
        headEl.setAttribute('aria-expanded', 'true');
      } else {
        toggleEl.textContent = '展开原文 ▾';
        headEl.setAttribute('aria-expanded', 'false');
      }
      snippetEl.hidden = !show;
      scrollBottom();
    });
  });
  scrollBottom();
}

async function sendMessage() {
  const question = input.value.trim();
  if (!question || state.busy) return;
  state.busy = true;
  sendBtn.disabled = true;
  input.value = '';

  addMessage('user').textContent = question;
  const aiBubble = addMessage('ai');

  // AI 气泡 = Markdown 正文 + 参考来源
  const mdBox = document.createElement('div');
  mdBox.className = 'md';
  aiBubble.appendChild(mdBox);
  const srcBox = document.createElement('div');
  srcBox.className = 'sources';
  aiBubble.appendChild(srcBox);

  let fullAnswer = '';
  let renderPending = false;
  const doRender = () => { mdBox.innerHTML = renderMarkdown(fullAnswer); };
  const scheduleRender = () => {
    if (renderPending) return;
    renderPending = true;
    // 合并同一帧内的多次 token 追加，避免每个 token 都全量渲染
    requestAnimationFrame(() => { renderPending = false; doRender(); scrollBottom(); });
  };

  try {
    const resp = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, conversationId: state.conversationId })
    });
    if (!resp.ok || !resp.body) throw new Error('请求失败 HTTP ' + resp.status);

    // 读取 SSE 流（ReadableStream），逐个事件处理
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // SSE 事件用空行分隔，逐个解析
      let idx;
      while ((idx = buffer.indexOf('\n\n')) !== -1) {
        const rawEvent = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        handleSseEvent(rawEvent);
      }
    }

    // 流结束兜底：确保最终内容已渲染
    doRender();
  } catch (e) {
    mdBox.innerHTML = '<span style="color:var(--danger)">⚠️ ' + esc(e.message) + '</span>';
  } finally {
    state.busy = false;
    sendBtn.disabled = false;
    input.focus();
    scrollBottom();
  }

  /** 解析并处理单个 SSE 事件（event: xxx \n data: yyy） */
  function handleSseEvent(rawEvent) {
    let eventName = 'message';
    let data = '';
    for (const line of rawEvent.split('\n')) {
      if (line.startsWith('event:')) eventName = line.slice(6).trim();
      else if (line.startsWith('data:')) data += line.slice(5).trim() + '\n';
    }
    data = data.trim();
    if (!data) return;

    try {
      if (eventName === 'token') {
        // 增量 token：累积后节流渲染（打字机效果 + Markdown 实时排版）
        fullAnswer += data;
        scheduleRender();
      } else if (eventName === 'meta') {
        // meta：会话 ID + 引用来源（来源在生成前已由后端算好）
        const obj = JSON.parse(data);
        if (obj.conversationId) state.conversationId = obj.conversationId;
        if (obj.sources) renderSources(srcBox, obj.sources);
      } else if (eventName === 'done') {
        const obj = JSON.parse(data);
        if (obj.conversationId) state.conversationId = obj.conversationId;
        doRender();
        scrollBottom();
      }
    } catch (e) {
      // 忽略解析失败（非 JSON 的 data）
    }
  }
}

/* ============ 文档管理 ============ */
async function loadDocs() {
  try {
    const resp = await fetch('/api/documents');
    const docs = await resp.json();
    const list = $('docList');
    if (!docs.length) {
      list.innerHTML = '<div class="doc-list-empty">尚未上传文档，快去上传吧～</div>';
      return;
    }
    list.innerHTML = docs.map(d => `
      <div class="doc-item">
        <span class="doc-icon">${iconFor(d.source)}</span>
        <div class="doc-info">
          <div class="doc-name" title="${esc(d.source)}">${esc(d.source)}</div>
          <div class="doc-meta">${d.chunks} 个分块</div>
        </div>
        <button onclick="deleteDoc('${esc(d.source).replace(/'/g, "\\'")}')" title="删除">✕</button>
      </div>`).join('');
  } catch (e) { console.error(e); }
}

function iconFor(name) {
  if (name.endsWith('.pdf')) return '📕';
  if (name.endsWith('.docx')) return '📘';
  if (name.endsWith('.xlsx') || name.endsWith('.xls')) return '📗';
  return '📄';
}

async function uploadFiles(files) {
  if (!files.length) return;
  const fd = new FormData();
  for (const f of files) fd.append('files', f);
  toast(`正在上传 ${files.length} 个文档…`);
  try {
    const resp = await fetch('/api/documents/batch', { method: 'POST', body: fd });
    const results = await resp.json();
    if (!resp.ok) throw new Error(results.error || '上传失败');
    const ok = results.filter(r => r.status === 'SUCCESS').length;
    toast(`✅ 成功入库 ${ok} 个文档`);
    loadDocs();
  } catch (e) { toast('⚠️ ' + e.message); }
}

async function deleteDoc(source) {
  if (!confirm(`确定删除「${source}」吗？`)) return;
  await fetch('/api/documents?source=' + encodeURIComponent(source), { method: 'DELETE' });
  toast('已删除 ' + source);
  loadDocs();
}

/* ============ 事件绑定 ============ */
const zone = $('uploadZone');
zone.addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', e => uploadFiles(e.target.files));
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
zone.addEventListener('drop', e => {
  e.preventDefault();
  zone.classList.remove('dragover');
  uploadFiles(e.dataTransfer.files);
});
sendBtn.addEventListener('click', sendMessage);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

loadDocs();
</script>
</body>
</html>
